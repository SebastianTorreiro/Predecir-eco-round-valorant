# ==============================================================================
# Configuración personalizada de Nginx para SPA (React)
# ==============================================================================

server {
    listen 80;
    server_name localhost;

    # Directorio de trabajo donde Nginx buscará los estáticos
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Soporte para SPA: redirigir todas las peticiones que no coincidan con un
    # archivo estático real al index.html de React.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché óptimo para archivos estáticos (Vite genera hashes únicos en los assets)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Deshabilitar mostrar la versión exacta de Nginx en los headers de respuesta (Seguridad)
    server_tokens off;

    # Habilitar compresión Gzip para reducir ancho de banda y acelerar carga
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/xml
        application/json
        application/ld+json;

    # Página de error por defecto
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
